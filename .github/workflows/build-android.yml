name: Build Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build debug APK (main)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: flutter build apk --debug
      - name: Build release APK (tag)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: flutter build apk --release
      - name: Stage artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/olivos-companion-debug.apk 2>/dev/null || true
          cp build/app/outputs/flutter-apk/app-release.apk dist/olivos-companion-release.apk 2>/dev/null || true
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error
          retention-days: 14
