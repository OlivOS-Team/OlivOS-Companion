name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.1'

jobs:
  validate:
    name: Validate, test and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - name: Run tests with coverage
        run: flutter test --coverage
      - name: Generate coverage report
        if: always()
        run: |
          mkdir -p test-results
          if [ ! -f coverage/lcov.info ]; then
            echo 'coverage/lcov.info not found; tests may have failed before coverage was written.' >&2
            exit 0
          fi
          python3 tools/coverage/coverage_summary.py coverage/lcov.info \
            --json test-results/coverage.json \
            --markdown test-results/coverage-summary.md
          if [ -f test-results/coverage-summary.md ]; then
            cat test-results/coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          genhtml coverage/lcov.info --output-directory test-results/html
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: |
            coverage/lcov.info
            test-results/coverage.json
            test-results/coverage-summary.md
            test-results/html
          if-no-files-found: warn
          retention-days: 14

  # Platform builds start only after validation succeeds, but are independent of
  # each other and run in parallel. All four must succeed before the tag release.
  build-android:
    name: Build Android
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Configure Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              echo "::error::Tag builds require Android signing secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, ANDROID_STORE_PASSWORD."
              exit 1
            fi
            echo "::warning::Android signing secrets are not configured; this build will use the ephemeral debug key and cannot upgrade signed releases."
            exit 0
          fi

          for name in ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Android signing secret ${name} is missing."
              exit 1
            fi
          done

          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | tr -d '\r\n' | base64 --decode > android/app/olivos-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "${ANDROID_STORE_PASSWORD}" \
            "${ANDROID_KEY_PASSWORD}" \
            "${ANDROID_KEY_ALIAS}" \
            "${GITHUB_WORKSPACE}/android/app/olivos-release.jks" > android/key.properties
          chmod 600 android/app/olivos-release.jks android/key.properties
      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f android/key.properties ]]; then
            flutter build apk --release
            cp build/app/outputs/flutter-apk/app-release.apk olivos-companion-android-release.apk
          else
            flutter build apk --debug
            cp build/app/outputs/flutter-apk/app-debug.apk olivos-companion-android-debug.apk
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: android
          path: olivos-companion-android-*.apk
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: NuGet/setup-nuget@v1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Download VC++ redistributable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force windows\installer\redist | Out-Null
          curl.exe -L --fail --retry 3 --retry-delay 2 -o windows\installer\redist\vc_redist.x64.exe https://aka.ms/vs/17/release/vc_redist.x64.exe
          $file = Get-Item windows\installer\redist\vc_redist.x64.exe
          if ($file.Length -lt 1MB) { throw 'VC++ redistributable download is incomplete' }
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package Windows portable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist\portable | Out-Null
          Copy-Item -Path build\windows\x64\runner\Release\* -Destination dist\portable -Recurse -Force
          New-Item -ItemType File -Force dist\portable\portable.flag | Out-Null
      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rawVersion = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$' | Select-Object -First 1).Matches.Groups[1].Value.Trim()
          if (-not $rawVersion) { throw 'Could not read version from pubspec.yaml' }
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $rawVersion = $env:GITHUB_REF_NAME.TrimStart('v') }
          $installerVersion = ($rawVersion -split '\+')[0]
          $numericVersion = ($installerVersion -split '-')[0]

          $iscc = $null
          $command = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if ($command) { $iscc = $command.Source }
          if (-not $iscc) { $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe not found' }

          & $iscc "/DMyAppVersion=$installerVersion" "/DMyAppVersionNumeric=$numericVersion" windows\installer\olivos-companion.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

          $installer = 'dist\olivos-companion-windows-setup-x64.exe'
          if (-not (Test-Path $installer)) { throw 'Installer was not created' }
      - name: Upload Windows portable
        uses: actions/upload-artifact@v6
        with:
          name: windows-portable
          path: dist/portable/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          path: dist/olivos-companion-windows-setup-x64.exe
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build macOS
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      # flutter_inappwebview_macos beta 的 SPM 包声明 macOS 10.14，
      # 与 AuthenticationServices 的 10.15 要求冲突；临时改走 CocoaPods。
      FLUTTER_SWIFT_PACKAGE_MANAGER: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package artifact
        shell: bash
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent *.app "$GITHUB_WORKSPACE/olivos-companion-macos.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: macos
          path: olivos-companion-macos.zip
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: Build iOS (unsigned)
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package artifact
        shell: bash
        run: |
          cd build/ios/iphoneos
          ditto -c -k --sequesterRsrc --keepParent *.app "$GITHUB_WORKSPACE/olivos-companion-ios.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: ios
          path: olivos-companion-ios.zip
          if-no-files-found: error
          retention-days: 14

  release-draft:
    name: Release draft
    if: github.ref_type == 'tag'
    needs: [validate, build-android, build-windows, build-macos, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-artifacts
      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          # Coverage is an Actions-only artifact; never let it reach the release.
          rm -rf release-artifacts/coverage
          test -f release-artifacts/windows-portable/portable.flag
          cp release-artifacts/android/olivos-companion-android-release.apk release-assets/
          cp release-artifacts/macos/olivos-companion-macos.zip release-assets/
          cp release-artifacts/ios/olivos-companion-ios.zip release-assets/
          cp release-artifacts/windows-installer/olivos-companion-windows-setup-x64.exe release-assets/

          # The portable artifact stays uncompressed in Actions; create the final
          # zip only here so the downloaded workflow artifact is not a zip-in-zip.
          (
            cd release-artifacts/windows-portable
            zip -q -r "$GITHUB_WORKSPACE/release-assets/olivos-companion-windows-portable-x64.zip" .
          )

          # One checksum file per release asset; never bundle coverage reports here.
          (
            cd release-assets
            for file in *; do
              case "$file" in
                *.sha256) continue ;;
              esac
              sha256sum "$file" > "$file.sha256"
            done
          )
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: OlivOS Companion ${{ github.ref_name }}
          draft: true
          allowUpdates: true
          removeArtifacts: true
          artifacts: release-assets/**/*
          body: |
            ## Windows

            - 安装版（推荐）：`olivos-companion-windows-setup-x64.exe`
            - 便携版：`olivos-companion-windows-portable-x64.zip`

            安装版会安装到 `Program Files`，创建开始菜单快捷方式，并检测/安装
            Microsoft Visual C++ 2015-2022 x64 运行库。首次运行需要系统中的
            Microsoft Edge WebView2 Runtime（Windows 11 通常已内置）。

            便携版不会安装运行库，目标机器仍需 Microsoft Visual C++ 2015-2022
            x64 运行库和 WebView2 Runtime。

            ## 校验

            每个发布产物旁都有同名的 `.sha256` 校验文件，不再提供合并的
            `SHA256SUMS`。覆盖率报告只作为 Actions artifact 保留，不进入 Release。
